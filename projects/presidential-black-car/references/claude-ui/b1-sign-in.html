<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Reference mockup for direction B (After Hours), exported from Claude design canvas. See SPEC-B.md. -->
<title>Sign in, After Hours</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Jost:wght@300..700&amp;display=swap">
<style>
body{margin:0;background:#2A2A2E;display:flex;justify-content:center}
*{box-sizing:border-box}
button{font:inherit}
input::placeholder{color:#8C877E}
a{color:#F6F4EF}a:hover{color:#C9A46B}
</style>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0E0E10; color: #F6F4EF; font-family: 'Jost', 'Avenir Next', 'Century Gothic', sans-serif">
<img src="../gpt-hero/hero-chicago-suburban-v1-preview.png" alt="Black SUV parked on a wet Chicago lakefront at night, with the skyline behind it" style="position: absolute; top: 0; left: 0; width: 390px; height: 640px; object-fit: cover; object-position: 58% 50%" />
<div style="position: absolute; top: 0; left: 0; width: 390px; height: 280px; background: linear-gradient(to bottom, rgba(14, 14, 16, 0.88) 0%, rgba(14, 14, 16, 0.55) 55%, rgba(14, 14, 16, 0) 100%)"></div>
<div style="position: absolute; top: 480px; left: 0; width: 390px; height: 160px; background: linear-gradient(to bottom, rgba(14, 14, 16, 0) 0%, #0E0E10 100%)"></div>
<div style="position: absolute; top: 76px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-family: 'Bodoni Moda', 'Didot', serif; font-style: italic; font-size: 13px; font-weight: 500; letter-spacing: 0.18em; color: #B08D57">PRESIDENTIAL BLACK CAR</p>
<h1 style="margin: 0; font-family: 'Bodoni Moda', 'Didot', 'Bodoni 72', serif; font-style: italic; font-weight: 500; font-size: 36px; line-height: 1.12; letter-spacing: -0.01em; color: #F6F4EF">Ordinary journeys.<br />Extraordinary care.</h1>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 16px; padding: 28px 24px 40px; background: rgba(14, 14, 16, 0.8); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid rgba(246, 244, 239, 0.12); border-radius: 28px 28px 0 0">
<h2 style="margin: 0; font-size: 18px; font-weight: 600; color: #F6F4EF">Sign in or create an account</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="b1-email" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #A8A39A">Email</label>
<input id="b1-email" type="email" placeholder="you@example.com" autocomplete="email" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(246, 244, 239, 0.18); background: rgba(246, 244, 239, 0.06); color: #F6F4EF; font-family: inherit; font-size: 16px; outline: none" />
</div>
<button type="button" style="height: 52px; border: none; border-radius: 12px; background: #B08D57; color: #0E0E10; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; cursor: pointer">Email me a code</button>
<button type="button" style="min-height: 44px; border: none; background: transparent; color: #F6F4EF; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">Use a password instead</button>
</div>
</div>
</body>
</html>
