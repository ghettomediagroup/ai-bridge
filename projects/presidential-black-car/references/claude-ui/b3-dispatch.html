<style>

<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0E0E10; color: #F6F4EF; font-family: 'Jost', 'Avenir Next', 'Century Gothic', sans-serif">

</div>
</article>

<button type="button" style="height: 96px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 14px; border-radius: 16px; border: 1px solid #2B2B31; background: #16161A; color: #F6F4EF; text-align: left; cursor: pointer"><span style="display: flex; color: #B08D57"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><circle cx="9" cy="9" r="3"></circle><path d="M3.5 18.5c.9-2.6 3-4 5.5-4s4.6 1.4 5.5 4"></path><circle cx="16.5" cy="10" r="2.5"></circle><path d="M15.5 14.6c2.1-.3 4.1.9 5 3.4"></path></svg></span><span style="font-size: 14px; font-weight: 600; line-height: 1.2">People</span></button>

<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: #8C877E; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 19.5c1.2-3.2 3.9-5 7-5s5.8 1.8 7 5"></path></svg><span style="font-size: 11px; font-weight: 500">Account</span></button>
